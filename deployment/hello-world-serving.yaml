apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: hello-world-bot
  annotations:
    scenarios.ai.sap.com/name: "hello-world-bot"
    executables.ai.sap.com/name: "hello-world-bot-serving"
  labels:
    scenarios.ai.sap.com/id: hello-world-bot
    ai.sap.com/version: "1.0.0"
spec:
  inputs:
    parameters:
      - name: image
        type: string
        default: ghcr.io/doletro/ooclsap-bot-repository:poc-adb9da58930f06db43fe027bde099c97878f60dc
    artifacts: []
  template:
    apiVersion: serving.kserve.io/v1beta1
    metadata:
      labels: |
        ai.sap.com/resourcePlan: starter
    spec: |
      predictor:
        imagePullSecrets:
          - name: ghcr
        containers:
          - name: kserve-container
            image: "{{inputs.parameters.image}}"
            ports:
              - containerPort: 5000
                protocol: TCP